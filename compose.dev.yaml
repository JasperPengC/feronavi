# ─────────────────────────────────────────────────────────────
# Feronavi · 本地开发覆盖（**不用于生产**）
#
# 用法：docker compose -f compose.yaml -f compose.dev.yaml up -d
#
# 与生产的唯一差别：把 db / cache 端口发布到 127.0.0.1（**用非默认端口，避免与机器上其它项目的 PG/Redis 撞车**），让宿主机上跑的
# 应用与 drizzle-kit 能连上。绑定回环地址，不对局域网暴露。
# ─────────────────────────────────────────────────────────────

services:
  db:
    ports:
      - "127.0.0.1:54329:5432"
  cache:
    ports:
      - "127.0.0.1:63799:6379"
