# A12 反向代理验证配置 —— 总纲 12.1 节三个代理陷阱全部落地：
#   ① client_max_body_size 必须 ≥ 附件上限（默认 25MB，这里 30m 留余量），
#      否则表现为"上传莫名失败"（代理层 413，应用根本收不到）
#   ② 转发 Host / X-Forwarded-*（应用要据此判断来源与协议）
#   ③ SSE/WebSocket 的缓冲关闭（后续 SSE 端点在代理下必须即时推送）
server {
  listen 8080;
  server_name _;

  client_max_body_size 30m;

  location / {
    proxy_pass http://host.docker.internal:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;          # SSE：不缓冲，事件即时到达
    proxy_read_timeout 3600s;     # 长连接（SSE/轮询）不被代理掐断
  }
}
