# ─────────────────────────────────────────────────────────────
# Feronavi · 自托管编排（主路径：docker compose up -d）
#
# 四个服务：app · worker · db · cache
#
# 默认从 GHCR 拉取发布镜像，不需要在用户机器上编译。
# 开发者源码构建：docker compose -f compose.yaml -f compose.source.yaml up -d --build
# 数据库首次构建需要编译扩展；后续使用本地构建缓存。
#
# ⚠️ 只有 app 暴露端口，且只绑 127.0.0.1 —— 对公网一律经反向代理
#    反向代理与安装配置见 README。
# ─────────────────────────────────────────────────────────────

services:
  app:
    image: ghcr.io/${FERONAVI_GH_OWNER:-feronavi}/feronavi-app:${FERONAVI_VERSION:-0.2.0}
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://feronavi:${DB_PASSWORD:?DB_PASSWORD 必须设置}@db:5432/feronavi
      REDIS_URL: redis://cache:6379
      DATA_DIR: /data
      NODE_ENV: production
      # 消费交给独立 worker；HTTP 进程仍负责 SLA / cron 等调度。
      JOB_WORKER_INTERVAL_MS: "0"
      MIGRATION_LOCK_TIMEOUT_MS: ${MIGRATION_LOCK_TIMEOUT_MS:-300000}
      # 默认不信任转发头；按实际反向代理网段显式配置
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      OUTBOUND_DNS_MODE: ${OUTBOUND_DNS_MODE:-system}
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      # 密钥、附件、安装标记都在这里 —— 备份必须包含它
      - feronavi-data:/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  worker:
    # 与 app 同镜像、不同入口 —— 避免两套依赖漂移
    image: ghcr.io/${FERONAVI_GH_OWNER:-feronavi}/feronavi-app:${FERONAVI_VERSION:-0.2.0}
    command: ["node", "dist-server/server/worker.js"]
    environment:
      DATABASE_URL: postgres://feronavi:${DB_PASSWORD:?DB_PASSWORD 必须设置}@db:5432/feronavi
      REDIS_URL: redis://cache:6379
      DATA_DIR: /data
      NODE_ENV: production
      JOB_WORKER_INTERVAL_MS: ${JOB_WORKER_INTERVAL_MS:-5000}
      MIGRATION_LOCK_TIMEOUT_MS: ${MIGRATION_LOCK_TIMEOUT_MS:-300000}
      WORKER_BACKLOG_WARNING_SECONDS: ${WORKER_BACKLOG_WARNING_SECONDS:-300}
      WORKER_SLOW_POLL_WARNING_SECONDS: ${WORKER_SLOW_POLL_WARNING_SECONDS:-300}
      OUTBOUND_DNS_MODE: ${OUTBOUND_DNS_MODE:-system}
    volumes:
      - feronavi-data:/data
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  db:
    image: ghcr.io/${FERONAVI_GH_OWNER:-feronavi}/feronavi-db:${FERONAVI_DB_VERSION:-16-0.2.0}
    # build:
    #   # ⚠️ 上下文必须是【仓库根】：Dockerfile 要 COPY 根目录的 LICENSE
    #   context: .
    #   dockerfile: docker/db/Dockerfile
    #   args:
    #     PG_MAJOR: ${PG_MAJOR:-16}
    #     # 网络不稳定时可改用镜像站，例如 mirrors.aliyun.com
    #     APT_MIRROR: ${APT_MIRROR:-}
    environment:
      POSTGRES_DB: feronavi
      POSTGRES_USER: feronavi
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 必须设置}
      # ⚠️ 必须 UTF8 + C.UTF-8：非 UTF-8 locale 会让中文分词直接失效
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    volumes:
      - feronavi-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feronavi -d feronavi"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    # 不暴露端口：只有 app/worker 需要连它

  cache:
    image: valkey/valkey:8-alpine
    # ⚠️ maxmemory-policy 必须是 noeviction：写成 allkeys-lru 会在内存吃紧时
    #    **静默淘汰队列任务**
    command:
      - valkey-server
      - --maxmemory
      - ${VALKEY_MAXMEMORY:-512mb}
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    volumes:
      - feronavi-cache:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  feronavi-data:
  feronavi-db:
  feronavi-cache:
