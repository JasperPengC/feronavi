name: Feature request
description: 提出一个可验证的产品需求
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前流程哪里卡住，不要直接跳到方案
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 可以附交互草图或竞品参考
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
